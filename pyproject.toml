[project]
name = "gestion-factures"
version = "1.0.0"
description = "Extraction, indexation et export de factures PDF renommées par client."
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.40,<2.0",
    "pymupdf>=1.24,<2.0",
]

[project.optional-dependencies]
# Suivi des envois sur Postgres. Optionnel : sans ces paquets, l'application
# utilise SQLite. Les isoler garde l'installation de base légère et évite
# qu'une roue indisponible fasse échouer tout le déploiement.
postgres = [
    "psycopg[binary]>=3.2,<4.0",
    "psycopg-pool>=3.2,<4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "psycopg[binary]>=3.2,<4.0",
    "psycopg-pool>=3.2,<4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 95
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplifications
    "RUF",  # règles ruff
    "S",    # bandit
]
ignore = [
    "S101",  # assert : légitime dans les tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.coverage.run]
source = ["src/factures"]
branch = true
