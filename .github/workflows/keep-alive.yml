## Empêche la mise en veille de la base et de l'application.
##
## Deux hébergements gratuits s'endorment après une période d'inactivité, ce qui
## piège une application de facturation sollicitée une fois par mois :
##
##   * la base (Supabase suspend un projet gratuit après ~7 jours) ;
##   * l'application (Streamlit Community Cloud endort une app après ~7 jours).
##
## Cette tâche les sollicite tous les 3 jours. Chaque étape est facultative et
## se contente d'un avertissement si son paramètre est absent.
##
## Paramètres, dans Settings > Secrets and variables > Actions :
##   * secret   `FACTURES_POSTGRES_URL` — chaîne de connexion de la base ;
##   * variable `STREAMLIT_APP_URL`     — adresse publique de l'application.
##
## Inutile si votre base ne se met jamais en pause (Neon, par exemple, reprend
## seule en moins d'une seconde) : dans ce cas, seule l'étape application sert.

name: keep-alive

on:
  schedule:
    # 06:17 UTC tous les 3 jours. Heure décalée : les tâches planifiées à
    # l'heure ronde sont massivement retardées chez GitHub.
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le client Postgres
        run: pip install "psycopg[binary]>=3.2,<4.0" "psycopg-pool>=3.2,<4.0"

      - name: Réveiller la base
        env:
          FACTURES_POSTGRES_URL: ${{ secrets.FACTURES_POSTGRES_URL }}
          PYTHONPATH: src
        run: |
          if [ -z "$FACTURES_POSTGRES_URL" ]; then
            echo "::warning::Secret FACTURES_POSTGRES_URL absent : étape ignorée."
            exit 0
          fi
          python - <<'PY'
          import os

          from factures.postgres_storage import PostgresSentStatusStore

          # Ouvrir le magasin crée la table si besoin et exécute une requête :
          # c'est exactement l'activité qui empêche la mise en pause.
          with PostgresSentStatusStore(os.environ["FACTURES_POSTGRES_URL"]) as store:
              store.get_many(["keep-alive"])
          print("Base active.")
          PY

      - name: Réveiller l'application
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Variable STREAMLIT_APP_URL absente : étape ignorée."
            exit 0
          fi
          # Une simple visite suffit à réarmer le compteur d'inactivité.
          # `--max-time` borne l'attente si l'app était déjà endormie.
          code=$(curl --silent --show-error --location --max-time 90 \
                      --output /dev/null --write-out '%{http_code}' "$APP_URL")
          echo "Réponse HTTP : $code"
          # Une app en cours de réveil peut répondre autre chose que 200 sans
          # que la visite soit perdue : seule une absence de réponse est un échec.
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::Application injoignable à $APP_URL"
            exit 1
          fi
